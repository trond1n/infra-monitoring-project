services:
  api:
    image: hashicorp/http-echo
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    networks:
      - monitoring

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
